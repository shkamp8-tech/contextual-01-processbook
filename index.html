<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Process Book – Contextual 01</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Access code screen -->
  <div class="lockscreen" id="lockscreen">
    <div class="lock">
      <h2 class="lock__title">ACCESS CODE</h2>
      <div class="lock__inputs">
        <input class="lock__digit" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" autofocus />
        <input class="lock__digit" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" />
        <input class="lock__digit" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" />
        <input class="lock__digit" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" />
      </div>
      <p class="lock__hint">Ask the creator for the access code</p>
      <p class="lock__error" id="lockError"></p>
    </div>
  </div>

  <!-- Welcome / instructions screen -->
  <div class="welcome" id="welcome">
    <div class="welcome__panel">
      <h2 class="welcome__title">📘 Process Book</h2>
      <p class="welcome__lead"><b>Drag</b> to pan · <b>scroll</b> to zoom · 🔑 pin codes unlock linked pages.</p>
      <p class="welcome__lead" style="opacity:.7;font-size:.85em">Work in progress — layout & content not final.</p>
      <button class="welcome__btn" id="welcomeContinue">Continue →</button>
    </div>
  </div>

  <header class="topbar">
    <h1>📘 Process Book</h1>
    <div class="topbar__right">
      <button class="btn-text" id="editToggle" title="Toggle edit mode">✏️ Edit</button>
      <button class="btn-text btn-add" id="addCard" title="Add card" style="display:none">+ Card</button>
      <button class="btn-text btn-add" id="addConn" title="Add connection" style="display:none">+ Line</button>
      <button class="btn-text btn-add" id="addImage" title="Add image" style="display:none">📷 Image</button>
      <input type="file" id="imageFileInput" accept="image/*" multiple style="display:none" />
      <button class="btn-text btn-export" id="exportData" title="Copy current layout JSON to clipboard — send to developer to make it the new default" style="display:none">📤 Share Layout</button>
      <button class="btn-text btn-export" id="resetData" title="Reset to default layout (your changes will be lost)" style="display:none">🔄 Reset</button>
      <button class="btn-text btn-export" id="restoreBackup" title="Restore previous local backup (undo last sync overwrite)" style="display:none">↩️ Restore Backup</button>
      <span class="sync-status" id="syncStatus" title="Cloud sync status">☁️</span>
      <span class="topbar__zoom" id="zoomLabel">100%</span>
      <button class="btn-icon" id="zoomIn" title="Zoom in">+</button>
      <button class="btn-icon" id="zoomOut" title="Zoom out">−</button>
      <button class="btn-icon" id="resetView" title="Reset view">⌂</button>
      <button class="btn-icon" id="themeToggle" title="Toggle theme">🌙</button>
    </div>
  </header>

  <div class="viewport" id="viewport">
    <div class="canvas" id="canvas"></div>
    <div class="drop-overlay" id="dropOverlay">Drop image(s) here</div>
  </div>

  <div class="minimap" id="minimap"></div>
  <div class="hint">Scroll to zoom · Drag to pan</div>

  <!-- Context menu -->
  <div class="ctx-menu" id="ctxMenu" style="display:none">
    <button data-action="edit">✏️ Edit</button>
    <button data-action="delete">🗑️ Delete</button>
    <button data-action="conn-from">🔗 Connect from here</button>
  </div>

  <!-- Modal overlay for card editing -->
  <div class="modal-overlay" id="modalOverlay" style="display:none">
    <div class="modal">
      <h3 class="modal__title" id="modalTitle">Edit Card</h3>
      <form id="cardForm" autocomplete="off">
        <label>ID <input name="id" required /></label>
        <label>Title <input name="title" /></label>
        <label>Phase
          <select name="phase">
            <option value="">—</option>
            <option>Research</option>
            <option>Concepting</option>
            <option>Design</option>
            <option>Prototype</option>
            <option>Testing</option>
            <option>Reflection</option>
            <option>Analysis</option>
          </select>
        </label>
        <label>Description <textarea name="desc" rows="3"></textarea></label>
        <label>Link <input name="link" type="url" /></label>
        <label>Date <input name="date" type="date" /></label>
        <label>Pin <input name="pin" /></label>
        <label>Image path <input name="image" placeholder="assets/photo.jpg" /></label>
        <label class="checkbox"><input name="small" type="checkbox" /> Small card</label>
        <label class="checkbox"><input name="info" type="checkbox" /> Info text box</label>
        <div class="modal__actions">
          <button type="button" id="modalCancel" class="btn-text">Cancel</button>
          <button type="submit" class="btn-text btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Connection modal -->
  <div class="modal-overlay" id="connOverlay" style="display:none">
    <div class="modal">
      <h3 class="modal__title">Add Connection</h3>
      <form id="connForm" autocomplete="off">
        <label>From card <select name="fromId" id="connFrom"></select></label>
        <label>From side
          <select name="fromSide"><option>bottom</option><option>top</option><option>right</option><option>left</option></select>
        </label>
        <label>To card <select name="toId" id="connTo"></select></label>
        <label>To side
          <select name="toSide"><option>top</option><option>bottom</option><option>right</option><option>left</option></select>
        </label>
        <div class="modal__actions">
          <button type="button" id="connCancel" class="btn-text">Cancel</button>
          <button type="submit" class="btn-text btn-primary">Add</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
