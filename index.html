<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Process Book – Contextual 01</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>📘 Process Book</h1>
    <div class="topbar__right">
      <span class="topbar__zoom" id="zoomLabel">100%</span>
      <button class="btn-icon" id="zoomIn" title="Zoom in">+</button>
      <button class="btn-icon" id="zoomOut" title="Zoom out">−</button>
      <button class="btn-icon" id="resetView" title="Reset view">⌂</button>
      <button class="btn-icon" id="themeToggle" title="Toggle theme">🌙</button>
    </div>
  </header>

  <div class="viewport" id="viewport">
    <div class="canvas" id="canvas"></div>
  </div>

  <div class="minimap" id="minimap"></div>
  <div class="hint">Scroll to zoom · Drag to pan</div>

  <script src="app.js"></script>
</body>
</html>
